name: CI

# 每次推送到 main、以及每个 PR，都跑一遍这个项目声称"通过"的东西。
#
# 这个文件的存在有一个具体的理由：README 与 SCHAT.md 里写了很多"✅ 已通过"的数字。
# 数字如果没有人替读者重新跑一遍，它就只是一句话。CI 把它变成可核对的。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 协议核心与 MLS 全部层
  # ---------------------------------------------------------------------------
  protocol:
    name: protocol (SCS-1 + MLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      # 从 protocol/ 里跑，不是从仓库根目录：根目录有 go.work，而根目录本身不属于
      # 任何 workspace 模块，所以从根目录 `go build ./...` 会被 Go 拒绝。
      - name: 单元测试与自洽性测试
        working-directory: protocol
        run: go test ./... -count=1

      - name: 竞态检测
        working-directory: protocol
        run: go test -race ./... -count=1

      - name: 构建
        working-directory: protocol
        run: go build ./...

  # ---------------------------------------------------------------------------
  # 中继服务器，以及它那两条"结构性"主张
  # ---------------------------------------------------------------------------
  server:
    name: server (relay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: 单元测试
        working-directory: server
        run: go test ./... -count=1

      - name: 构建
        working-directory: server
        run: go build ./...

      - name: 主张一：零第三方依赖
        working-directory: server
        run: |
          # GOWORK=off 是关键：否则 go.work 会把 protocol 也拉进来，
          # 于是这项检查会因为一个服务器刻意不依赖的模块而失败。
          deps="$(GOWORK=off go list -m all | tail -n +2)"
          if [ -n "$deps" ]; then
            echo "::error::服务端出现了第三方依赖："
            echo "$deps"
            exit 1
          fi
          echo "✓ 只有自身模块"

      - name: 主张二：服务端不含解密代码（不导入协议核心）
        working-directory: server
        run: |
          # 这一条不是风格问题：服务器能看到全部密文与元数据，它唯一能给出的
          # 隐私保证是"读不懂"。一旦它导入了协议核心，那个保证就只剩下一句承诺。
          if GOWORK=off go list -deps ./... | grep -q 'Schat/protocol'; then
            echo "::error::服务端导入了协议核心，它因此可能解密"
            GOWORK=off go list -deps ./... | grep 'Schat/protocol'
            exit 1
          fi
          echo "✓ 依赖树里没有协议核心"

  # ---------------------------------------------------------------------------
  # 安卓客户端核心（纯 JVM）
  # ---------------------------------------------------------------------------
  #
  # 关于这个 job，有三件事要说明白：
  #
  # 1. 为什么它标着 continue-on-error
  #
  #    :core 本身是纯 JVM 模块（android/core/build.gradle.kts 的原话是
  #    "Depends on: nothing but the Kotlin standard library"），但
  #    settings.gradle.kts 里 include 了 :app，而 :app 是 Android 模块，
  #    配置阶段就要求 SDK 里存在它声明的 compileSdk（37）。GitHub 的 runner
  #    预装 Android SDK，但装的是哪个 platform 不由本仓库决定。
  #
  #    所以：这个 job 的结果**要读**，但它变黄不代表代码有问题，而可能只是
  #    runner 上的 SDK 版本对不上。本地跑 tools/verify.ps1 是权威的那一次。
  #
  # 2. 为什么不用 android-actions/setup-android
  #
  #    它发现 runner 预装的 sdkmanager 是 12.0，就判定"版本错误"，然后去
  #    dl.google.com 下载一个新的命令行工具，再跑 `sdkmanager --licenses`——
  #    那一步会去拉 Google 的远程仓库清单，然后卡在那里直到超时。
  #
  #    一个与我们的代码毫无关系的动作，成了这个 job 最容易失败的地方。
  #    runner 已经装好了 SDK，所以这里直接用它。
  #
  # 3. 为什么先打印 SDK 里有什么
  #
  #    如果它失败了，日志要能回答"到底缺什么"。上面那一步就是在回答这个。
  android-core:
    name: android :core (best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # 这些在 ubuntu-latest 上通常已经设好；显式写出来是因为下面的 ls 依赖它，
      # 而一个空变量会让那一步输出"没有 platforms 目录"，误导诊断。
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # JDK 25：Android Gradle Plugin 9.x 与 Gradle 9.5 的要求。
          java-version: '25'

      - name: 报告 runner 上装了哪个 Android platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "--- platforms ---"
          ls -1 "$ANDROID_HOME/platforms" 2>/dev/null || echo "(没有 platforms 目录)"
          echo "--- build-tools ---"
          ls -1 "$ANDROID_HOME/build-tools" 2>/dev/null || echo "(没有 build-tools 目录)"
          echo "本项目 (:app) 需要的是 platform 37 与 build-tools 37。"

      - name: 允许 gradlew 执行
        # 这个仓库是在 Windows 上开发的，可执行位不一定跟着进了 git。
        run: chmod +x android/gradlew

      - name: 客户端核心测试
        working-directory: android
        run: ./gradlew :core:test --console=plain

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: android/core/build/test-results/test/*.xml
          if-no-files-found: ignore
