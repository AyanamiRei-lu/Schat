# Gradle settings for the SCHAT Android client.
#
# NOTE ON DISK SPACE: this project is developed on a machine whose system drive
# has limited free space, so the Gradle home is redirected to D: by setting the
# GRADLE_USER_HOME environment variable before invoking the wrapper:
#
#     $env:GRADLE_USER_HOME = "D:\gradle-home"   # PowerShell
#     ./gradlew assembleDebug
#
# See docs/BUILDING.md.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# The configuration cache makes repeat builds of an unchanged project much
# faster, which matters when the protocol core is rebuilt frequently.
org.gradle.configuration-cache=true

# AndroidX is mandatory for Jetpack Compose.
android.useAndroidX=true
# Each module gets its own R class, which keeps the app's R class small.
android.nonTransitiveRClass=true

kotlin.code.style=official
